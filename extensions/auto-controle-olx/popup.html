<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Importador OLX</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">AUTO CONTROLE</p>
    <h1>Importador OLX</h1>
    <p class="hint">Abra um anúncio de veículo na OLX e importe os dados e fotos para revisão.</p>
    <button id="import">Ler anúncio aberto</button>
    <p id="status" role="status"></p>
    <label>Endereço do Auto Controle
      <input id="target" type="url" spellcheck="false">
    </label>
    <button id="save" class="secondary">Salvar endereço</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
