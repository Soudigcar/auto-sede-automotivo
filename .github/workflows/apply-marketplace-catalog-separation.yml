name: Apply marketplace catalog separation

on:
  push:
    branches:
      - refactor/marketplace-catalog

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/marketplace-catalog
          fetch-depth: 0

      - name: Apply navigation patch and remove temporary files
        run: node scripts/apply-marketplace-catalog-separation.mjs

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: route marketplace to permanent catalog"
          git push origin HEAD:refactor/marketplace-catalog
