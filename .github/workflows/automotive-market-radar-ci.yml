name: Automotive Market Radar CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/api/cron/automotive-market-radar/**'
      - 'src/lib/server/automotive-market-radar/**'
      - 'src/components/AutomotiveMarketRadarPanel.tsx'
      - 'src/app/master/automotive-brain/page.tsx'
      - 'tests/automotive-market-radar/**'
      - 'tsconfig.radar-tests.json'
      - 'supabase/migrations/*automotive_market_radar.sql'
      - '.github/workflows/automotive-market-radar-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Radar tests
        run: |
          rm -rf .radar-test-dist
          npx tsc -p tsconfig.radar-tests.json
          node --test .radar-test-dist/tests/automotive-market-radar/aggregate.test.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          AUTOMOTIVE_MARKET_RADAR_SECRET: test-radar-secret
        run: npm run build
