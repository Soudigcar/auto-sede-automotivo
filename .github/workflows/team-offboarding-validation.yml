name: Store team offboarding validation

on:
  push:
    branches:
      - fix/store-team-member-offboarding

permissions:
  contents: read

concurrency:
  group: store-team-offboarding-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Verify branch baseline and diff
        run: |
          git fetch origin main
          test "$(git merge-base origin/main HEAD)" = "$(git rev-parse origin/main)"
          git diff --check origin/main...HEAD

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Focused offboarding tests
        run: node --import tsx --test tests/store-team-member-offboarding.test.ts

      - name: Full test suite
        run: npm test

      - name: Build
        run: npm run build
