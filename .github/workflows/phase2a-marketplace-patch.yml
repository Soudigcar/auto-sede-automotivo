name: Apply Phase 2A marketplace patch

on:
  workflow_dispatch:
  status:

permissions:
  contents: write
  statuses: write

concurrency:
  group: phase2a-marketplace-patch
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.state == 'success' &&
        startsWith(github.event.context, 'Vercel')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify trigger targets current main
        id: trigger
        shell: bash
        run: |
          main_sha="$(git rev-parse HEAD)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          event_sha="${{ github.event.sha }}"
          if [ -n "$event_sha" ] && [ "$event_sha" = "$main_sha" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring Vercel status for non-main commit: $event_sha"
          fi

      - name: Mark patch pending
        if: steps.trigger.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.trigger.outputs.main_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: 'pending',
              context: 'phase2a-marketplace-patch',
              description: 'Running controlled Phase 2A patch'
            });

      - name: Setup Node.js
        id: setup
        if: steps.trigger.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply controlled changes
        id: patch
        if: steps.trigger.outputs.eligible == 'true' && steps.setup.outcome == 'success'
        continue-on-error: true
        run: python3 .github/scripts/phase2a-marketplace-patch.mjs

      - name: Detect functional changes
        id: changes
        if: steps.trigger.outputs.eligible == 'true' && steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if git diff --quiet -- \
            'src/app/api/store-stock/route.ts' \
            'src/app/api/site-bulk-publish/route.ts' \
            'src/app/api/marketplace/vehicles/route.ts' \
            'src/app/api/store/sale-confirmation/route.ts' \
            'src/components/PipelineSaleConfirmation.tsx' \
            'src/app/loja/[slug]/pipeline/page.tsx' \
            'src/components/AuthGate.tsx' \
            'src/app/master/site/page.tsx'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        id: install
        if: steps.changes.outputs.changed == 'true'
        continue-on-error: true
        run: npm ci

      - name: Typecheck
        id: typecheck
        if: steps.changes.outputs.changed == 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Validate diff
        id: diff
        if: steps.changes.outputs.changed == 'true' && steps.typecheck.outcome == 'success'
        continue-on-error: true
        run: git diff --check

      - name: Commit functional changes
        id: publish
        if: steps.changes.outputs.changed == 'true' && steps.diff.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ steps.trigger.outputs.main_sha }}" ]; then
            echo 'main changed while the patch was being validated; refusing to push.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'src/app/api/store-stock/route.ts' \
            'src/app/api/site-bulk-publish/route.ts' \
            'src/app/api/marketplace/vehicles/route.ts' \
            'src/app/api/store/sale-confirmation/route.ts' \
            'src/components/PipelineSaleConfirmation.tsx' \
            'src/app/loja/[slug]/pipeline/page.tsx' \
            'src/components/AuthGate.tsx' \
            'src/app/master/site/page.tsx'
          git commit -m 'feat: secure marketplace ownership and sold vehicle lifecycle'
          git push origin HEAD:main

      - name: Summarize patch result
        id: result
        if: always() && steps.trigger.outputs.eligible == 'true'
        shell: bash
        env:
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          CHANGES_OUTCOME: ${{ steps.changes.outcome }}
          CHANGED: ${{ steps.changes.outputs.changed }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          DIFF_OUTCOME: ${{ steps.diff.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          state='success'
          description='Phase 2A patch completed successfully'

          if [ "$SETUP_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A failed while setting up Node.js'
          elif [ "$PATCH_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A patch script failed'
          elif [ "$CHANGES_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A failed while detecting changes'
          elif [ "$CHANGED" != 'true' ]; then
            description='Phase 2A already applied or no changes needed'
          elif [ "$INSTALL_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A failed during npm ci'
          elif [ "$TYPECHECK_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A failed during TypeScript typecheck'
          elif [ "$DIFF_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A failed during git diff validation'
          elif [ "$PUBLISH_OUTCOME" != 'success' ]; then
            state='failure'
            description='Phase 2A failed while committing or pushing'
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"

      - name: Publish patch result
        if: always() && steps.trigger.outputs.eligible == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TARGET_SHA: ${{ steps.trigger.outputs.main_sha }}
          RESULT_STATE: ${{ steps.result.outputs.state }}
          RESULT_DESCRIPTION: ${{ steps.result.outputs.description }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.TARGET_SHA,
              state: process.env.RESULT_STATE,
              context: 'phase2a-marketplace-patch',
              description: process.env.RESULT_DESCRIPTION
            });

      - name: Fail workflow after reporting
        if: always() && steps.trigger.outputs.eligible == 'true' && steps.result.outputs.state == 'failure'
        run: exit 1
