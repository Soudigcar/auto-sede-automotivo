name: Apply Phase 2A marketplace patch

on:
  workflow_dispatch:
  status:

permissions:
  contents: write

concurrency:
  group: phase2a-marketplace-patch
  cancel-in-progress: false

jobs:
  apply-patch:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.state == 'success' &&
        startsWith(github.event.context, 'Vercel')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify trigger targets current main
        id: trigger
        shell: bash
        run: |
          main_sha="$(git rev-parse HEAD)"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          event_sha="${{ github.event.sha }}"
          if [ -n "$event_sha" ] && [ "$event_sha" = "$main_sha" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Ignoring Vercel status for non-main commit: $event_sha"
          fi

      - name: Setup Node.js
        if: steps.trigger.outputs.eligible == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply controlled changes
        if: steps.trigger.outputs.eligible == 'true'
        run: python3 .github/scripts/phase2a-marketplace-patch.mjs

      - name: Detect functional changes
        if: steps.trigger.outputs.eligible == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- \
            'src/app/api/store-stock/route.ts' \
            'src/app/api/site-bulk-publish/route.ts' \
            'src/app/api/marketplace/vehicles/route.ts' \
            'src/app/api/store/sale-confirmation/route.ts' \
            'src/components/PipelineSaleConfirmation.tsx' \
            'src/app/loja/[slug]/pipeline/page.tsx' \
            'src/components/AuthGate.tsx' \
            'src/app/master/site/page.tsx'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.changed == 'true'
        run: npm run typecheck

      - name: Validate diff
        if: steps.changes.outputs.changed == 'true'
        run: git diff --check

      - name: Commit functional changes
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${{ steps.trigger.outputs.main_sha }}" ]; then
            echo 'main changed while the patch was being validated; refusing to push.'
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'src/app/api/store-stock/route.ts' \
            'src/app/api/site-bulk-publish/route.ts' \
            'src/app/api/marketplace/vehicles/route.ts' \
            'src/app/api/store/sale-confirmation/route.ts' \
            'src/components/PipelineSaleConfirmation.tsx' \
            'src/app/loja/[slug]/pipeline/page.tsx' \
            'src/components/AuthGate.tsx' \
            'src/app/master/site/page.tsx'
          git commit -m 'feat: secure marketplace ownership and sold vehicle lifecycle'
          git push origin HEAD:main
